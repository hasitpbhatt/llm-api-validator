# LLM API Validator — standalone CORS proxy (Cloudflare Worker, optional)
# Default deploy is Pages + Pages Functions (functions/api/[[path]].js, same-origin /api).
# Use this Worker only if you want a separate proxy URL: npx wrangler deploy
# The static page (index.html) deploys separately to Cloudflare Pages.

name = "llm-api-validator-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Fallback API base when the request omits ?target=. Leave empty to require it.
DEFAULT_TARGET = ""
# Optional allowlist of hostnames or URLs, e.g.
#   ALLOWED_TARGETS = "api.openai.com,api.anthropic.com,openrouter.ai"
# When set, requests to any other host (or subdomain match) get 403.
# When unset, any PUBLIC endpoint is allowed (BYOK — user's own token).
# Loopback/private/metadata hosts are always refused. There is intentionally
# no server-side API_KEY: with CORS '*', a key held here would be stealable
# by any website. All auth comes per-request from the user (never stored).
# ALLOWED_TARGETS = ""

[dev]
port = 8787
